<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>calculator</title>
</head>
<body>
    <h1>CALCULATOR</h1>
    <form>
        <select id="op">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">x</option>
            <option value="/">/</option>
            
        </select><br><br>
        <label for="a">a:</label>
        <input id="a" placeholder="a" type="number"><br><br>
        
        <label for="b">b:</label>
        <input id="b" placeholder="b" type="number"><br><br>
        <button type="button" onclick="display()">submit</button>
        <p id="dis"></p>
        <p id="res"></p>
    </form>
    
    <script>
        function display()
        {
            document.getElementById("dis").textContent="Kết quả:";
            const a=Number(document.getElementById("a").value);
            const b=Number(document.getElementById("b").value);
            const op= document.getElementById("op").value;
            let res;

            if(op=="+") res=a+b;
            else if(op=="-") res=a-b;
            else if(op=="*") res=a*b;
            else if(op=="/") res=(b===0)?"không chi được cho 0":a/b;

            document.getElementById("res").textContent=res;
        }
    </script>
</body>
